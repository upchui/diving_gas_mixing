services:
  nitrox-calculator:
    build: .
    image: nitrox-calculator
    container_name: nitrox-calculator
    ports:
      - "8381:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
