server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Page, service worker and manifest: always check with the server (304 if unchanged)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Scripts and styles: only the current version (?v=<hash>, stamped in by the Docker
    # build) never changes. Any other ?v= gets today's file, so it must not be cached for long.
    location ~* \.(?:js|css)$ {
        set $cache_control "no-cache";
        if ($arg_v = "__ASSET_VERSION__") {
            set $cache_control "public, max-age=31536000, immutable";
        }
        add_header Cache-Control $cache_control always;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
