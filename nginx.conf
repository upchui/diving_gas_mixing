server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Page, service worker and manifest: always check with the server (304 if unchanged)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Scripts and styles: versioned URLs (?v=...) never change, unversioned ones are revalidated
    location ~* \.(?:js|css)$ {
        set $cache_control "no-cache";
        if ($arg_v) {
            set $cache_control "public, max-age=31536000, immutable";
        }
        add_header Cache-Control $cache_control always;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
